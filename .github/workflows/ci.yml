name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SFML
        run: |
          sudo apt-get update
          sudo apt-get install -y libsfml-dev libgl1-mesa-dev

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build
        run: |
          cmake --build build -j 2

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure

  asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SFML
        run: |
          sudo apt-get update
          sudo apt-get install -y libsfml-dev libgl1-mesa-dev

      - name: Configure (sanitizers)
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DENABLE_SANITIZERS=ON

      - name: Build (sanitizers)
        run: |
          cmake --build build-asan -j 2

      - name: Test (sanitizers)
        run: |
          ctest --test-dir build-asan --output-on-failure


